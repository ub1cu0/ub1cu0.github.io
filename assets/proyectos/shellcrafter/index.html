<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShellCrafter — ub1cu0</title>
    <meta name="description"
        content="Ensamblador en el navegador para shellcoding: x86, x86-64, ARM, Thumb y ARM64. Detecta bad chars y exporta el shellcode listo para pegar.">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .checker-wrap {
            width: min(1100px, 94vw);
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .config-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .config-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select,
        input[type="text"] {
            background: linear-gradient(180deg, #15151c, #12121a);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 9px 12px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            outline: none;
            transition: border-color .18s, box-shadow .18s;
        }

        select:hover,
        input[type="text"]:hover {
            border-color: var(--red);
            box-shadow: 0 0 18px #ff163f44;
        }

        select:focus,
        input[type="text"]:focus {
            border-color: var(--red);
            box-shadow: var(--glow);
        }

        .chk {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 9px;
        }

        .chk input {
            accent-color: var(--red);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .chk label {
            text-transform: none;
            letter-spacing: 0;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
            height: 460px;
        }

        @media (max-width: 900px) {
            .editor-container {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        /* Mismos paneles que el resto del sitio: degradado, borde fino y glow rojo */
        .editor-pane {
            background: linear-gradient(180deg, var(--panel), var(--panel-2));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .02), var(--glow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color .18s, box-shadow .18s;
        }

        .editor-pane:focus-within {
            border-color: #3a2030;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .02), 0 0 32px rgba(255, 22, 63, .28);
        }

        .pane-header {
            padding: 10px 16px;
            background: linear-gradient(180deg, rgba(255, 22, 63, .07), rgba(255, 22, 63, .02));
            border-bottom: 1px solid var(--line);
            font-size: 0.9rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            padding: 16px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            white-space: pre;
            overflow: auto;
            min-height: 300px;
            tab-size: 4;
        }

        .output-list {
            flex: 1;
            padding: 16px;
            overflow: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 300px;
        }

        .output-line {
            display: flex;
            gap: 12px;
            padding: 2px 0;
            line-height: 1.6;
            align-items: baseline;
        }

        .output-line:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .line-num {
            color: var(--muted);
            width: 42px;
            flex: 0 0 42px;
            text-align: right;
            user-select: none;
            opacity: 0.7;
        }

        .hex-bytes {
            color: #a9b7c6;
            min-width: 0;
            flex: 1;
            /* que el salto de linea caiga entre bytes y nunca dentro de uno */
            word-break: normal;
            overflow-wrap: normal;
        }

        .hex-bytes .byte-ok,
        .hex-bytes .byte-null,
        .hex-bytes .byte-bad {
            white-space: nowrap;
        }

        .hex-bytes.empty {
            opacity: 0.25;
        }

        .hex-bytes.err {
            color: var(--red);
            font-size: 0.85em;
        }

        .line-group {
            background: linear-gradient(90deg, rgba(255, 22, 63, .08), transparent 70%);
            border-left: 2px solid var(--red);
            padding-left: 6px;
            border-radius: 4px;
        }

        .line-failed {
            background: linear-gradient(90deg, rgba(255, 22, 63, .16), transparent 80%);
            border-left: 2px solid var(--red);
            padding-left: 6px;
            border-radius: 4px;
        }

        .group-note {
            color: var(--muted);
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 1px 8px;
            white-space: nowrap;
            flex: 0 0 auto;
            align-self: center;
            cursor: help;
        }

        .byte-ok {
            color: #a9b7c6;
        }

        .byte-null {
            color: #ff8fa3;
            text-shadow: 0 0 10px rgba(255, 143, 163, .5);
        }

        .byte-bad {
            color: #ff163f;
            font-weight: 700;
            text-decoration: underline;
            text-shadow: 0 0 12px rgba(255, 22, 63, .8);
        }

        .pane-note {
            font-size: 0.78rem;
            opacity: 0.6;
        }

        .out-panel {
            background: linear-gradient(180deg, var(--panel), var(--panel-2));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .02), var(--glow);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .out-body {
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #ff8fa3;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 220px;
            overflow: auto;
            margin: 0;
            min-height: 1.4em;
        }

        .status-bar {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .status-ok {
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.2);
        }

        .status-warn {
            background: rgba(255, 176, 32, 0.1);
            color: #ffb020;
            border: 1px solid rgba(255, 176, 32, 0.25);
        }

        .status-error {
            background: rgba(255, 22, 63, 0.1);
            color: #ff163f;
            border: 1px solid rgba(255, 22, 63, 0.2);
        }

        .btn {
            background: linear-gradient(90deg, rgba(255, 22, 63, .9), rgba(255, 22, 63, .55));
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-ghost {
            background: linear-gradient(180deg, #15151c, #12121a);
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-ghost:hover {
            color: #fff;
            border-color: var(--red);
            box-shadow: 0 0 18px #ff163f44;
        }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-tools select {
            padding: 4px 8px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--red);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>
    <div class="rain" id="rain" aria-hidden="true"></div>

    <div class="checker-wrap">
        <a href="/proyectos/" class="back-link">← Volver a Proyectos</a>

        <h1>ShellCrafter</h1>
        <p>Escribe ensamblador, detecta bad chars y genera shellcode.</p>

        <div class="config-bar">
            <div class="config-item">
                <label for="archSelect">Arquitectura</label>
                <select id="archSelect">
                    <option value="x86">cargando...</option>
                </select>
            </div>

            <div class="config-item" style="flex:1; min-width:180px;">
                <label for="badCharsInput">Bad chars (hex)</label>
                <input type="text" id="badCharsInput" value="00 0a 0d" placeholder="Ej: 00 0a 0d" spellcheck="false">
            </div>

            <div class="config-item">
                <label for="presetSelect">Preset</label>
                <select id="presetSelect">
                    <option value="">Cargar preset…</option>
                </select>
            </div>

        </div>

        <div class="editor-container">
            <div class="editor-pane">
                <div class="pane-header">
                    <span>Ensamblador</span>
                    <span class="pane-note">comentarios: ; # //</span>
                </div>
                <textarea id="asmInput" spellcheck="false" placeholder="; cargando el ensamblador..."></textarea>
            </div>

            <div class="editor-pane">
                <div class="pane-header">
                    <span>Bytes por línea</span>
                    <span id="byteCount">0 bytes</span>
                </div>
                <div class="output-list" id="hexOutput">
                    <div class="output-line"><span class="line-num">-</span><span class="hex-bytes empty">Escribe
                            ensamblador para ver los bytes...</span></div>
                </div>
            </div>
        </div>

        <div class="out-panel">
            <div class="pane-header">
                <span>Shellcode</span>
                <span class="header-tools">
                    <select id="formatSelect">
                        <option value="escaped">"\x41\x42" (entre comillas)</option>
                        <option value="raw">\x41\x42 (one liner)</option>
                        <option value="hex">4142 (hex plano)</option>
                        <option value="hexspace">41 42 (hex con espacios)</option>
                        <option value="python">Python bytes</option>
                        <option value="c">C string</option>
                        <option value="carray">C array</option>
                    </select>
                    <button class="btn-ghost" id="copyFormatBtn">Copiar</button>
                </span>
            </div>
            <pre class="out-body" id="shellcodeOut"></pre>
        </div>

        <div id="statusBox" class="status-bar status-ok" style="display:none;"></div>
    </div>

    <script src="/assets/js/app.js" defer></script>
    <script type="module" src="js/logic.js"></script>
</body>

</html>
